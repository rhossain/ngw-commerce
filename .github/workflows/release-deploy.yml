name: Release Deploy (Hostinger Webhook)

on:
  push:
    branches:
      - release
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'

jobs:
  call-hostinger-webhook:
    name: Trigger Hostinger Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Invoke deployment webhook
        env:
          WEBHOOK_URL: https://webhooks.hostinger.com/deploy/7942f0beed8aeacc3b0c1d52be56fd6b
        run: |
          echo "Calling Hostinger webhook..."
          http_code=$(curl -s -o response.txt -w "%{http_code}" "$WEBHOOK_URL")
          echo "HTTP Status: $http_code" || true
          echo "---- Response ----" || true
          cat response.txt || true
          if [ "$http_code" -ge 400 ]; then
            echo "Webhook failed with status $http_code" >&2
            exit 1
          fi
      - name: Summary
        if: success()
        run: |
          echo "Deployment webhook invoked successfully." > $GITHUB_STEP_SUMMARY