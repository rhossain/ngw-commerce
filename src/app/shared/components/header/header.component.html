<header class="bg-white shadow-md sticky top-0 z-50">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-bold text-primary-600">
          WooShop
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex md:items-center md:space-x-8">
        <a routerLink="/" routerLinkActive="text-primary-600" [routerLinkActiveOptions]="{exact: true}" 
           class="text-gray-700 hover:text-primary-600 transition">
          Home
        </a>
        <a routerLink="/shop" routerLinkActive="text-primary-600" 
           class="text-gray-700 hover:text-primary-600 transition">
          Shop
        </a>
        <a routerLink="/products" routerLinkActive="text-primary-600" 
           class="text-gray-700 hover:text-primary-600 transition">
          Products
        </a>
      </div>

      <!-- Right Side Icons -->
      <div class="flex items-center space-x-4">
        <!-- Global Search -->
        <div id="global-search-wrapper" class="relative hidden lg:block" (keydown)="onKeyDown($event)">
          <div class="flex items-center gap-2">
            <div class="relative">
              <input
                type="text"
                class="w-72 pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                placeholder="Search products..."
                [value]="searchTerm"
                (focus)="focusSearch()"
                (input)="onSearchInput($any($event.target).value)"
                autocomplete="off"
              />
              <svg class="w-5 h-5 text-gray-400 absolute left-2 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <button *ngIf="searchTerm" (click)="clearSearch()" class="absolute right-2 top-2 text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <select class="border border-gray-300 rounded-lg py-2 px-2 text-sm focus:ring-primary-500 focus:border-primary-500" (change)="onCategoryChange($any($event.target).value)">
              <option value="">All Categories</option>
              <option *ngFor="let c of categories" [value]="c.slug">{{ c.name }}</option>
            </select>
          </div>
          <!-- Dropdown -->
          <div *ngIf="searchOpen && showDropdown" class="absolute mt-2 w-[26rem] bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden z-50">
            <div *ngIf="searchTerm.length < 3" class="p-4 text-sm text-gray-500">Type at least 3 characters…</div>
            <div *ngIf="searchTerm.length >= 3">
              <div *ngIf="searching" class="p-4 text-sm text-gray-500 flex items-center gap-2">
                <span class="animate-spin inline-block w-4 h-4 border-2 border-gray-300 border-t-primary-500 rounded-full"></span>
                Searching…
              </div>
              <ul *ngIf="!searching && suggestions.length > 0" role="listbox" class="max-h-80 overflow-y-auto divide-y divide-gray-100" [attr.aria-activedescendant]="activeIndex >=0 ? 'suggest-'+activeIndex : null">
                <li *ngFor="let p of suggestions; let i = index" role="option" [id]="'suggest-'+i" [attr.aria-selected]="i === activeIndex" class="hover:bg-gray-50" [class.bg-gray-100]="i === activeIndex">
                  <a [routerLink]="['/products', p.slug]" (click)="clearSearch()" class="flex items-start gap-3 px-4 py-3 focus:outline-none">
                    <img *ngIf="p.images && p.images.length" [src]="p.images[0].src" class="w-10 h-10 object-cover rounded" alt="{{p.name}}" />
                    <div class="flex-1 min-w-0">
                      <p class="text-sm font-medium text-gray-800 line-clamp-1">{{ p.name }}</p>
                      <p class="text-xs text-gray-500" *ngIf="p.price_html" [innerHTML]="p.price_html"></p>
                    </div>
                  </a>
                </li>
              </ul>
              <div *ngIf="!searching && suggestions.length === 0" class="p-4 text-sm text-gray-500">No matching products found.</div>
              <div class="border-t border-gray-200 bg-gray-50 flex items-center justify-between px-3 py-2 text-xs text-gray-600" *ngIf="searchTerm.length >=3">
                <a [routerLink]="['/shop']" [queryParams]="{ search: searchTerm, category: chosenCategorySlug || null }" (click)="clearSearch()" class="px-3 py-1 bg-primary-600 text-white rounded-md text-xs hover:bg-primary-700">Show All</a>
                <span *ngIf="suggestions.length > 0" class="italic">Showing top {{ suggestions.length }} results</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Wishlist -->
        <a routerLink="/wishlist" class="relative p-2 text-gray-700 hover:text-primary-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span *ngIf="wishlistCount > 0" 
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
            {{wishlistCount}}
          </span>
        </a>

        <!-- Cart -->
        <a routerLink="/cart" class="relative p-2 text-gray-700 hover:text-primary-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span *ngIf="cartItemsCount > 0" 
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
            {{cartItemsCount}}
          </span>
        </a>

        <!-- User Menu -->
        <div *ngIf="isAuthenticated$ | async; else loginButton" id="user-menu" class="relative">
          <button type="button" (click)="toggleUserMenu()" class="flex items-center space-x-2 text-gray-700 hover:text-primary-600 transition"
                  aria-haspopup="true" [attr.aria-expanded]="userMenuOpen">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div *ngIf="userMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
            <a routerLink="/account/profile" (click)="userMenuOpen = false" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              My Account
            </a>
            <a routerLink="/account/orders" (click)="userMenuOpen = false" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Orders
            </a>
            <a routerLink="/account/addresses" (click)="userMenuOpen = false" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Addresses
            </a>
            <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Logout
            </button>
          </div>
        </div>

        <ng-template #loginButton>
          <button (click)="openLoginModal()" class="text-gray-700 hover:text-primary-600 transition">
            Login
          </button>
        </ng-template>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden py-4">
      <a routerLink="/" class="block py-2 text-gray-700 hover:text-primary-600">Home</a>
      <a routerLink="/shop" class="block py-2 text-gray-700 hover:text-primary-600">Shop</a>
      <a routerLink="/products" class="block py-2 text-gray-700 hover:text-primary-600">Products</a>
      <a routerLink="/wishlist" class="block py-2 text-gray-700 hover:text-primary-600">Wishlist</a>
      
      <div *ngIf="isAuthenticated$ | async; else mobileLoginButtons">
        <a routerLink="/account/profile" class="block py-2 text-gray-700 hover:text-primary-600">My Account</a>
        <button (click)="logout()" class="block w-full text-left py-2 text-gray-700 hover:text-primary-600">Logout</button>
      </div>
      
      <ng-template #mobileLoginButtons>
        <button (click)="openLoginModal(); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-700 hover:text-primary-600">Login</button>
        <button (click)="openRegisterModal(); toggleMobileMenu()" class="block w-full text-left py-2 text-gray-700 hover:text-primary-600">Register</button>
      </ng-template>
    </div>
  </nav>
</header>
