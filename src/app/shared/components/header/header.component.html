<header class="bg-white shadow-md sticky top-0 z-50">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-bold text-primary-600">
          WooShop
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex md:items-center md:space-x-8">
        <a routerLink="/" routerLinkActive="text-primary-600" [routerLinkActiveOptions]="{exact: true}" 
           class="text-gray-700 hover:text-primary-600 transition">
          Home
        </a>
        <a routerLink="/shop" routerLinkActive="text-primary-600" 
           class="text-gray-700 hover:text-primary-600 transition">
          Shop
        </a>
        <a routerLink="/products" routerLinkActive="text-primary-600" 
           class="text-gray-700 hover:text-primary-600 transition">
          Products
        </a>
      </div>

      <!-- Right Side Icons -->
      <div class="flex items-center space-x-4">
        <!-- Search Icon -->
        <button class="p-2 text-gray-700 hover:text-primary-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <!-- Wishlist -->
        <a routerLink="/wishlist" class="relative p-2 text-gray-700 hover:text-primary-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span *ngIf="wishlistCount > 0" 
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
            {{wishlistCount}}
          </span>
        </a>

        <!-- Cart -->
        <a routerLink="/cart" class="relative p-2 text-gray-700 hover:text-primary-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span *ngIf="cartItemsCount > 0" 
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
            {{cartItemsCount}}
          </span>
        </a>

        <!-- User Menu -->
        <div *ngIf="isAuthenticated$ | async; else loginButton" class="relative">
          <button class="flex items-center space-x-2 text-gray-700 hover:text-primary-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden group-hover:block">
            <a routerLink="/account/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              My Account
            </a>
            <a routerLink="/account/orders" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Orders
            </a>
            <a routerLink="/account/addresses" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Addresses
            </a>
            <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Logout
            </button>
          </div>
        </div>

        <ng-template #loginButton>
          <a routerLink="/account/login" class="text-gray-700 hover:text-primary-600 transition">
            Login
          </a>
        </ng-template>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden py-4">
      <a routerLink="/" class="block py-2 text-gray-700 hover:text-primary-600">Home</a>
      <a routerLink="/shop" class="block py-2 text-gray-700 hover:text-primary-600">Shop</a>
      <a routerLink="/products" class="block py-2 text-gray-700 hover:text-primary-600">Products</a>
      <a routerLink="/wishlist" class="block py-2 text-gray-700 hover:text-primary-600">Wishlist</a>
      <a routerLink="/account/profile" class="block py-2 text-gray-700 hover:text-primary-600">My Account</a>
    </div>
  </nav>
</header>
