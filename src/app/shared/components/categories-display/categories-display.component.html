<!-- Section Header -->
<section *ngIf="showTitle || showViewAll" 
         class="flex items-center justify-between mb-6">
  <h3 *ngIf="showTitle" class="text-2xl md:text-3xl font-bold text-gray-900">
    <ng-container *ngIf="!titleHighlight">{{ title }}</ng-container>
    <ng-container *ngIf="titleHighlight">
      {{ title.split(titleHighlight)[0] }}
      <span class="text-cyan-500">{{ titleHighlight }}</span>
      {{ title.split(titleHighlight)[1] }}
    </ng-container>
  </h3>
  
  <button *ngIf="showViewAll" 
          [routerLink]="viewAllLink"
          class="text-cyan-500 flex items-center gap-2 hover:text-cyan-600 font-medium transition">
    View All <i class="fas fa-chevron-right text-sm"></i>
  </button>
</section>

<!-- Flat List Style (Circular Icons Grid) -->
<div *ngIf="displayStyle === 'flat-list'" 
     [class]="'grid gap-6 ' + getGridColumnsClass() + ' ' + containerClass">
  <div *ngFor="let category of categories; trackBy: trackByCategory; let i = index" 
       [routerLink]="getCategoryLink(category)"
       class="text-center category-item cursor-pointer"
       [class.category-hover]="enableHover">
    
    <!-- Circular Icon Container -->
    <div [class]="getSizeClass()"
         [ngClass]="{
           'bg-blue-50': i === 0,
           'bg-gray-100': i !== 0
         }"
         [style.background-color]="category.color"
         class="rounded-full mx-auto mb-3 flex items-center justify-center shadow-md hover:shadow-lg transition">
      
      <!-- Font Awesome Icon -->
      <i *ngIf="category.icon && !category.imageUrl" 
         [class]="'fas ' + category.icon + ' ' + getIconSizeClass()"
         [ngClass]="{
           'text-cyan-500': i === 0,
           'text-gray-600': i !== 0
         }"></i>
      
      <!-- Image -->
      <img *ngIf="category.imageUrl" 
           [src]="category.imageUrl" 
           [alt]="category.name"
           class="w-full h-full object-cover rounded-full">
      
      <!-- Count Badge -->
      <span *ngIf="showCount && category.count" 
            class="absolute -top-2 -right-2 bg-cyan-500 text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">
        {{ category.count }}
      </span>
    </div>
    
    <!-- Category Name -->
    <p class="font-medium text-gray-900 text-sm">{{ category.name }}</p>
  </div>
</div>

<!-- Masonry Grid Style (Card-based Layout) -->
<div *ngIf="displayStyle === 'masonry-grid'" 
     [class]="'grid gap-5 ' + getGridColumnsClass() + ' ' + containerClass">
  <div *ngFor="let category of categories; trackBy: trackByCategory"
       [routerLink]="getCategoryLink(category)"
       [class]="getCardStyleClass()"
       class="cursor-pointer transition relative"
       [class.category-hover]="enableHover">
    
    <!-- Image Header (if available) -->
    <div *ngIf="category.imageUrl" 
         class="w-full h-32 rounded-lg mb-4 overflow-hidden">
      <img [src]="category.imageUrl" 
           [alt]="category.name"
           class="w-full h-full object-cover hover:scale-110 transition duration-300">
    </div>
    
    <!-- Icon Header (if no image) -->
    <div *ngIf="!category.imageUrl && category.icon"
         class="w-full h-32 rounded-lg mb-4 bg-gradient-to-br from-cyan-50 to-blue-50 flex items-center justify-center">
      <i [class]="'fas ' + category.icon + ' text-5xl text-cyan-500'"></i>
    </div>
    
    <!-- Content -->
    <div class="flex items-start justify-between">
      <div class="flex-1">
        <h4 class="font-semibold text-gray-900 text-base mb-1">{{ category.name }}</h4>
        <p *ngIf="category.description" 
           class="text-sm text-gray-600 line-clamp-2">
          {{ category.description }}
        </p>
      </div>
      
      <!-- Count Badge -->
      <span *ngIf="showCount && category.count" 
            class="ml-2 bg-gray-100 text-gray-700 text-xs font-medium px-2 py-1 rounded-full whitespace-nowrap">
        {{ category.count }}
      </span>
    </div>
    
    <!-- Arrow Icon -->
    <div class="absolute bottom-4 right-4 text-cyan-500 opacity-0 group-hover:opacity-100 transition">
      <i class="fas fa-arrow-right"></i>
    </div>
  </div>
</div>

<!-- Carousel Style (Swiper) -->
<div *ngIf="displayStyle === 'carousel'" 
     [class]="'categories-carousel ' + containerClass">
  <swiper-container
    [slides-per-view]="carouselOptions.slidesPerView"
    [space-between]="carouselOptions.spaceBetween"
    [loop]="carouselOptions.loop"
    [autoplay]="carouselOptions.autoplay ? { delay: carouselOptions.autoplayDelay } : false"
    [navigation]="carouselOptions.navigation"
    [pagination]="carouselOptions.pagination ? { clickable: true } : false"
    [breakpoints]="carouselOptions.breakpoints"
    class="categories-swiper">
    
    <swiper-slide *ngFor="let category of categories; trackBy: trackByCategory">
      <div [routerLink]="getCategoryLink(category)"
           class="text-center cursor-pointer category-item"
           [class.category-hover]="enableHover">
        
        <!-- Circular Icon Container -->
        <div [class]="getSizeClass()"
             [style.background-color]="category.color || '#f3f4f6'"
             class="rounded-full mx-auto mb-3 flex items-center justify-center shadow-md hover:shadow-lg transition relative">
          
          <!-- Font Awesome Icon -->
          <i *ngIf="category.icon && !category.imageUrl" 
             [class]="'fas ' + category.icon + ' ' + getIconSizeClass()"
             class="text-gray-600"></i>
          
          <!-- Image -->
          <img *ngIf="category.imageUrl" 
               [src]="category.imageUrl" 
               [alt]="category.name"
               class="w-full h-full object-cover rounded-full">
          
          <!-- Count Badge -->
          <span *ngIf="showCount && category.count" 
                class="absolute -top-2 -right-2 bg-cyan-500 text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">
            {{ category.count }}
          </span>
        </div>
        
        <!-- Category Name -->
        <p class="font-medium text-gray-900 text-sm px-2">{{ category.name }}</p>
      </div>
    </swiper-slide>
  </swiper-container>
</div>

<!-- Empty State -->
<div *ngIf="categories.length === 0" 
     class="text-center py-12">
  <i class="fas fa-folder-open text-6xl text-gray-300 mb-4"></i>
  <p class="text-gray-500 text-lg">No categories available</p>
</div>
