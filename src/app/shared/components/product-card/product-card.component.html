<div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 group">
  <a [routerLink]="['/products', product.slug]" class="block relative">
    <!-- Product Image -->
    <div class="relative overflow-hidden aspect-square">
      <img 
        [src]="getMainImage()" 
        [alt]="'Product image showing ' + product.name"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
      />
      
      <!-- Sale Badge -->
      <div *ngIf="isOnSale()" 
           class="absolute top-2 left-2 bg-red-500 text-white px-2 py-1 rounded-md text-xs font-semibold">
        SALE
      </div>

      <!-- Featured Badge -->
      <div *ngIf="product.featured" 
           class="absolute top-2 right-2 bg-primary-600 text-white px-2 py-1 rounded-md text-xs font-semibold">
        FEATURED
      </div>

      <!-- Wishlist Button -->
      <button 
        (click)="toggleWishlist($event)"
        class="absolute bottom-2 right-2 bg-white p-2 rounded-full shadow-md hover:bg-gray-100 transition"
        [attr.aria-label]="isInWishlist() ? 'Remove from wishlist' : 'Add to wishlist'"
      >
        <svg 
          class="w-5 h-5" 
          [class.text-red-500]="isInWishlist()"
          [class.fill-current]="isInWishlist()"
          [class.text-gray-600]="!isInWishlist()"
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </button>

      <!-- Out of Stock Overlay -->
      <div *ngIf="product.stock_status === 'outofstock'" 
           class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <span class="bg-white text-gray-900 px-4 py-2 rounded-md font-semibold">
          Out of Stock
        </span>
      </div>
    </div>
  </a>

  <!-- Product Info -->
  <div class="p-4">
    <!-- Product Name -->
    <a [routerLink]="['/products', product.slug]">
      <h3 class="text-lg font-semibold text-gray-900 hover:text-primary-600 transition line-clamp-2 mb-2">
        {{product.name}}
      </h3>
    </a>

    <!-- Rating -->
    <div *ngIf="product.rating_count > 0" class="flex items-center mb-2">
      <div class="flex text-yellow-400">
        <svg *ngFor="let star of [1,2,3,4,5]" 
             class="w-4 h-4"
             [class.fill-current]="star <= +product.average_rating"
             [class.text-gray-300]="star > +product.average_rating"
             viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      </div>
      <span class="text-sm text-gray-600 ml-2">({{product.review_count}})</span>
    </div>

    <!-- Price -->
    <div *ngIf="hasValidPrice()" class="flex items-baseline space-x-2 mb-3">
      <span *ngIf="isOnSale()" class="text-lg font-bold text-red-600">
        ${{getPriceDisplay()}}
      </span>
      <span 
        class="font-bold"
        [class.text-lg]="!isOnSale()"
        [class.text-gray-900]="!isOnSale()"
        [class.text-sm]="isOnSale()"
        [class.text-gray-500]="isOnSale()"
        [class.line-through]="isOnSale()"
      >
        ${{getRegularPriceDisplay()}}
      </span>
    </div>

    <!-- Add to Cart Button -->
    <button 
      (click)="addToCart($event)"
      [disabled]="product.stock_status === 'outofstock'"
      class="w-full bg-primary-600 text-white py-2 rounded-md hover:bg-primary-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
    >
      <span *ngIf="product.stock_status === 'instock'">Add to Cart</span>
      <span *ngIf="product.stock_status === 'outofstock'">Out of Stock</span>
      <span *ngIf="product.stock_status === 'onbackorder'">Pre-order</span>
    </button>
  </div>
</div>
