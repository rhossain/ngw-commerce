<div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 group">
  <a [routerLink]="['/products', product.slug]" class="block relative">
    <!-- Product Image -->
    <div class="relative overflow-hidden aspect-square">
      <img 
        [src]="displayImage" 
        [alt]="'Product image showing ' + product.name"
        class="w-full h-full object-cover group-hover:scale-110 transition-all duration-300"
      />
      
      <!-- Sale Badge -->
      <div *ngIf="displayOnSale" 
           class="absolute top-2 left-2 bg-red-500 text-white px-2 py-1 rounded-md text-xs font-semibold">
        SALE
      </div>

      <!-- Featured Badge -->
      <div *ngIf="product.featured" 
           class="absolute top-2 right-2 bg-blue-400 text-white px-2 py-1 rounded-md text-xs font-semibold">
        FEATURED
      </div>

      <!-- Wishlist Button -->
      <button 
        (click)="toggleWishlist($event)"
        class="absolute bottom-2 right-2 bg-white p-2 rounded-full shadow-md hover:bg-gray-100 transition"
        [attr.aria-label]="isInWishlist() ? 'Remove from wishlist' : 'Add to wishlist'"
      >
        <svg 
          class="w-5 h-5" 
          [class.text-red-500]="isInWishlist()"
          [class.fill-current]="isInWishlist()"
          [class.text-gray-600]="!isInWishlist()"
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </button>

      <!-- Out of Stock Overlay -->
      <div *ngIf="product.stock_status === 'outofstock'" 
           class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <span class="bg-white text-gray-900 px-4 py-2 rounded-md font-semibold">
          Out of Stock
        </span>
      </div>
    </div>
  </a>

  <!-- Product Info -->
  <div class="p-4">
    <!-- Product Name -->
    <a [routerLink]="['/products', product.slug]">
      <h3 class="text-lg font-semibold text-gray-900 hover:text-primary-600 transition line-clamp-2 mb-2">
        {{product.name}}
      </h3>
    </a>

    <!-- Rating -->
    <div *ngIf="product.rating_count > 0" class="flex items-center mb-2">
      <div class="flex text-yellow-400">
        <svg *ngFor="let star of [1,2,3,4,5]" 
             class="w-4 h-4"
             [class.fill-current]="star <= +product.average_rating"
             [class.text-gray-300]="star > +product.average_rating"
             viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      </div>
      <span class="text-sm text-gray-600 ml-2">({{product.review_count}})</span>
    </div>

    <!-- Price -->
    <div *ngIf="hasValidPrice()" class="flex items-baseline space-x-2 mb-3">
      <span *ngIf="displayOnSale" class="text-lg font-bold text-red-600">
        ${{displayPrice}}
      </span>
      <span 
        class="font-bold"
        [class.text-lg]="!displayOnSale"
        [class.text-gray-900]="!displayOnSale"
        [class.text-sm]="displayOnSale"
        [class.text-gray-500]="displayOnSale"
        [class.line-through]="displayOnSale"
      >
        ${{displayOnSale ? displayRegularPrice : displayPrice}}
      </span>
    </div>

    <!-- Inline Variant Selector for Variable Products -->

    <!-- Inline Variant Selector for Variable Products -->
    <div *ngIf="isVariableProduct() && showVariantSelector" class="mb-3 space-y-2">
      <div *ngFor="let attribute of getVariationAttributes()" class="space-y-1">
        <label class="block text-xs font-medium text-gray-700">
          {{attribute.name}}
        </label>
        <select 
          [(ngModel)]="selectedAttributes[attribute.name]"
          (ngModelChange)="onAttributeChange(attribute.name)"
          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
        >
          <option [value]="''">Choose {{attribute.name}}</option>
          <option *ngFor="let option of attribute.options" [value]="option">
            {{option}}
          </option>
        </select>
      </div>

      <!-- Stock status message for selected variation -->
      <p *ngIf="selectedVariation && selectedVariation.stock_status === 'outofstock'" 
         class="text-xs text-red-600 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        This variation is out of stock
      </p>

      <!-- Selection prompt -->
      <p *ngIf="!selectedVariation && getVariationAttributes().length > 0" 
         class="text-xs text-amber-600 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Select all options to add to cart
      </p>
    </div>

    <!-- Action Buttons -->
    <div *ngIf="product.stock_status !== 'outofstock'">
      <!-- Quick Add (inline selector toggle) for Variable Products -->
      <div *ngIf="isVariableProduct()" class="space-y-2">
        <button 
          *ngIf="!showVariantSelector"
          (click)="toggleVariantSelector($event)"
          class="w-full bg-blue-400 text-white py-2 rounded-md hover:bg-blue-500 transition font-medium"
        >
          Quick Add
        </button>

        <!-- Add to Cart button when selector is shown -->
        <button 
          *ngIf="showVariantSelector"
          (click)="addToCart($event)"
          [disabled]="!canAddVariableToCart()"
          [class.bg-blue-400]="canAddVariableToCart()"
          [class.hover:bg-blue-500]="canAddVariableToCart()"
          [class.bg-gray-400]="!canAddVariableToCart()"
          [class.cursor-not-allowed]="!canAddVariableToCart()"
          class="w-full text-white py-2 rounded-md transition font-medium"
        >
          <span *ngIf="!selectedVariation">Select Options</span>
          <span *ngIf="selectedVariation && selectedVariation.stock_status === 'outofstock'">Out of Stock</span>
          <span *ngIf="selectedVariation && selectedVariation.stock_status !== 'outofstock'">Add to Cart</span>
        </button>

        <!-- View Details link -->
        <a 
          [routerLink]="['/products', product.slug]"
          class="block w-full text-center bg-gray-100 text-gray-700 py-2 rounded-md hover:bg-gray-200 transition font-medium text-sm"
          (click)="$event.stopPropagation()"
        >
          View Full Details
        </a>
      </div>

      <!-- Add to Cart for Simple Products -->
      <button 
        *ngIf="!isVariableProduct()"
        (click)="addToCart($event)"
        class="w-full bg-blue-400 text-white py-2 rounded-md hover:bg-blue-500 transition font-medium"
      >
        <span *ngIf="product.stock_status === 'instock'">Add to Cart</span>
        <span *ngIf="product.stock_status === 'onbackorder'">Pre-order</span>
      </button>
    </div>

    <!-- Out of Stock Button -->
    <button 
      *ngIf="product.stock_status === 'outofstock'"
      disabled
      class="w-full bg-gray-400 text-white py-2 rounded-md cursor-not-allowed font-medium"
    >
      Out of Stock
    </button>
  </div>
</div>
