<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-4">Products</h1>
      
      <!-- Search Bar -->
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="flex-1 w-full md:max-w-md">
          <div class="relative">
            <input 
              type="text" 
              #searchInput
              (keyup.enter)="onSearch(searchInput.value)"
              placeholder="Search products..." 
              class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            />
            <svg class="absolute left-3 top-3 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <!-- Sort and Filter Buttons -->
        <div class="flex gap-4">
          <select 
            [(ngModel)]="searchParams.orderby"
            (change)="onSortChange(searchParams.orderby!)"
            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          >
            <option *ngFor="let option of sortOptions" [value]="option.value">
              {{option.label}}
            </option>
          </select>

          <button 
            (click)="toggleFilters()"
            class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition flex items-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Filters Panel -->
    <div *ngIf="showFilters" class="bg-white rounded-lg shadow-md p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Category Filter -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
          <select 
            [(ngModel)]="searchParams.category"
            (change)="onCategoryChange(searchParams.category!)"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
          >
            <option value="">All Categories</option>
            <option *ngFor="let category of categories" [value]="category">{{category}}</option>
          </select>
        </div>

        <!-- Price Range -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Price Range</label>
          <div class="flex items-center gap-2">
            <input 
              type="number" 
              [(ngModel)]="minPrice"
              placeholder="Min" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
            />
            <span>-</span>
            <input 
              type="number" 
              [(ngModel)]="maxPrice"
              placeholder="Max" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
            />
          </div>
          <button 
            (click)="onPriceFilter()"
            class="mt-2 w-full px-4 py-2 bg-blue-400 text-white rounded-md hover:bg-blue-500 transition"
          >
            Apply
          </button>
        </div>

        <!-- Stock Filter -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Availability</label>
          <label class="flex items-center">
            <input 
              type="checkbox" 
              [(ngModel)]="searchParams.in_stock"
              (change)="onInStockChange(searchParams.in_stock!)"
              class="rounded border-gray-300 text-primary-600 focus:ring-primary-500"
            />
            <span class="ml-2 text-sm text-gray-700">In Stock Only</span>
          </label>
        </div>
      </div>

      <!-- Clear Filters -->
      <div class="mt-4 flex justify-end">
        <button 
          (click)="clearFilters()"
          class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition"
        >
          Clear All Filters
        </button>
      </div>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!(loading$ | async); else loadingTemplate">
      <div *ngIf="(products$ | async) as products">
        <div *ngIf="products.length > 0; else noProducts" 
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <app-product-card 
            *ngFor="let product of products" 
            [product]="product">
          </app-product-card>
        </div>

        <!-- Pagination -->
        <div *ngIf="(pagination$ | async) as pagination" class="mt-8">
          <div class="flex justify-center items-center space-x-2">
            <button 
              (click)="onPageChange(pagination.currentPage - 1)"
              [disabled]="pagination.currentPage === 1"
              class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Previous
            </button>

            <div class="flex space-x-1">
              <button 
                *ngFor="let page of [].constructor(pagination.pages); let i = index"
                (click)="onPageChange(i + 1)"
                [class.bg-blue-400]="pagination.currentPage === i + 1"
                [class.text-white]="pagination.currentPage === i + 1"
                [class.border-blue-600]="pagination.currentPage === i + 1"
                class="px-3 py-2 border border-gray-300 rounded-md hover:bg-blue-500"
              >
                {{i + 1}}
              </button>
            </div>

            <button 
              (click)="onPageChange(pagination.currentPage + 1)"
              [disabled]="pagination.currentPage === pagination.pages"
              class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Next
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Template -->
    <ng-template #loadingTemplate>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="bg-white rounded-lg shadow-md overflow-hidden animate-pulse">
          <div class="h-64 bg-gray-300"></div>
          <div class="p-4">
            <div class="h-4 bg-gray-300 rounded mb-2"></div>
            <div class="h-4 bg-gray-300 rounded w-2/3"></div>
          </div>
        </div>
      </div>
    </ng-template>

    <!-- No Products Template -->
    <ng-template #noProducts>
      <div class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No products found</h3>
        <p class="mt-1 text-sm text-gray-500">Try adjusting your search or filter criteria.</p>
        <div class="mt-6">
          <button 
            (click)="clearFilters()"
            class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-400 hover:bg-blue-500"
          >
            Clear Filters
          </button>
        </div>
      </div>
    </ng-template>
  </div>
</div>
