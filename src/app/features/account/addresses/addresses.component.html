<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">My Addresses</h1>
      <p class="mt-2 text-gray-600">Manage your billing and shipping addresses</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="bg-white rounded-lg shadow-md p-12 text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600 mx-auto"></div>
      <p class="mt-4 text-gray-600">Loading addresses...</p>
    </div>

    <!-- Addresses -->
    <div *ngIf="!loading" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- Billing Address -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="bg-blue-400 text-white px-6 py-4 flex justify-between items-center">
          <h2 class="text-xl font-semibold">Billing Address</h2>
          <button 
            *ngIf="!isEditingBilling"
            (click)="toggleEditBilling()"
            class="text-white hover:text-primary-100 transition"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </button>
        </div>
        
        <form [formGroup]="billingForm" class="p-6 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                First Name <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                formControlName="first_name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                [class.bg-gray-100]="!isEditingBilling"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Last Name <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                formControlName="last_name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                [class.bg-gray-100]="!isEditingBilling"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
            <input 
              type="text" 
              formControlName="company"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
              [class.bg-gray-100]="!isEditingBilling"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Email <span class="text-red-500">*</span>
            </label>
            <input 
              type="email" 
              formControlName="email"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
              [class.bg-gray-100]="!isEditingBilling"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Phone <span class="text-red-500">*</span>
            </label>
            <input 
              type="tel" 
              formControlName="phone"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
              [class.bg-gray-100]="!isEditingBilling"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Address <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              formControlName="address_1"
              placeholder="Street address"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 mb-2"
              [class.bg-gray-100]="!isEditingBilling"
            />
            <input 
              type="text" 
              formControlName="address_2"
              placeholder="Apartment, suite, etc. (optional)"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
              [class.bg-gray-100]="!isEditingBilling"
            />
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                City <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                formControlName="city"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                [class.bg-gray-100]="!isEditingBilling"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                State <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                formControlName="state"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                [class.bg-gray-100]="!isEditingBilling"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                ZIP <span class="text-red-500">*</span>
              </label>
              <input 
                type="text" 
                formControlName="postcode"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                [class.bg-gray-100]="!isEditingBilling"
              />
            </div>
