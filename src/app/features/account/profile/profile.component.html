<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- Sidebar Navigation -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
          <div class="p-6 bg-blue-400 text-white">
            <div class="flex items-center">
              <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center">
                <svg class="w-10 h-10 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <div class="ml-4" *ngIf="(currentUser$ | async) as user">
                <h3 class="font-semibold">{{user.first_name}} {{user.last_name}}</h3>
                <p class="text-sm text-primary-100">{{user.email}}</p>
              </div>
            </div>
          </div>
          
          <nav class="p-4">
            <a 
              routerLink="/account/profile" 
              routerLinkActive="bg-primary-50 text-primary-600 border-l-4 border-primary-600"
              class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded transition"
            >
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              My Profile
            </a>
            
            <a 
              routerLink="/account/orders" 
              routerLinkActive="bg-primary-50 text-primary-600 border-l-4 border-primary-600"
              class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded transition"
            >
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
              My Orders
            </a>
            
            <a 
              routerLink="/account/addresses" 
              routerLinkActive="bg-primary-50 text-primary-600 border-l-4 border-primary-600"
              class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded transition"
            >
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Addresses
            </a>
            
            <a 
              routerLink="/wishlist" 
              class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded transition"
            >
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
              </svg>
              Wishlist
            </a>
            
            <button 
              (click)="logout()"
              class="w-full flex items-center px-4 py-3 text-red-600 hover:bg-red-50 rounded transition"
            >
              <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Logout
            </button>
          </nav>
        </div>
      </div>

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-6">
        
        <!-- Profile Information -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Profile Information</h2>
            <button 
              *ngIf="!isEditingProfile"
              (click)="toggleEditProfile()"
              class="px-4 py-2 border border-primary-600 text-primary-600 rounded-md hover:bg-primary-50 transition"
            >
              Edit Profile
            </button>
          </div>

          <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                <input 
                  type="text" 
                  formControlName="first_name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  [class.bg-gray-100]="!isEditingProfile"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                <input 
                  type="text" 
                  formControlName="last_name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  [class.bg-gray-100]="!isEditingProfile"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input 
                  type="email" 
                  formControlName="email"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  [class.bg-gray-100]="!isEditingProfile"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Display Name</label>
                <input 
                  type="text" 
                  formControlName="display_name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  [class.bg-gray-100]="!isEditingProfile"
                />
              </div>
            </div>

            <div *ngIf="isEditingProfile" class="flex gap-4 mt-6">
              <button 
                type="submit"
                [disabled]="isUpdatingProfile"
                class="px-6 py-2 bg-blue-400 text-white rounded-md hover:bg-blue-500 transition disabled:opacity-50"
              >
                <span *ngIf="!isUpdatingProfile">Save Changes</span>
                <span *ngIf="isUpdatingProfile">Saving...</span>
              </button>
              <button 
                type="button"
                (click)="toggleEditProfile()"
                class="px-6 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>

        <!-- Change Password -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Change Password</h2>
            <button 
              *ngIf="!showPasswordForm"
              (click)="togglePasswordForm()"
              class="px-4 py-2 border border-primary-600 text-primary-600 rounded-md hover:bg-primary-50 transition"
            >
              Change Password
            </button>
          </div>

          <div *ngIf="showPasswordForm">
            <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
                  <input 
                    type="password" 
                    formControlName="current_password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  />
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                  <input 
                    type="password" 
                    formControlName="new_password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  />
                  <div *ngIf="passwordForm.get('new_password')?.invalid && passwordForm.get('new_password')?.touched" 
                       class="mt-1 text-sm text-red-600">
                    Password must be at least 6 characters
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
                  <input 
                    type="password" 
                    formControlName="confirm_password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500"
                  />
                  <div *ngIf="passwordForm.get('confirm_password')?.hasError('passwordMismatch') && passwordForm.get('confirm_password')?.touched" 
                       class="mt-1 text-sm text-red-600">
                    Passwords do not match
                  </div>
                </div>
              </div>

              <div class="flex gap-4 mt-6">
                <button 
                  type="submit"
                  [disabled]="isChangingPassword"
                  class="px-6 py-2 bg-blue-400 text-white rounded-md hover:bg-blue-500 transition disabled:opacity-50"
                >
                  <span *ngIf="!isChangingPassword">Update Password</span>
                  <span *ngIf="isChangingPassword">Updating...</span>
                </button>
                <button 
                  type="button"
                  (click)="togglePasswordForm()"
                  class="px-6 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>

          <div *ngIf="!showPasswordForm" class="text-gray-600">
            <p>Click "Change Password" to update your password.</p>
          </div>
        </div>

        <!-- Account Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center">
              <div class="w-12 h-12 bg-primary-100 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
              </div>
              <div class="ml-4">
                <p class="text-sm text-gray-600">Total Orders</p>
                <p class="text-2xl font-bold text-gray-900">12</p>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center">
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <div class="ml-4">
                <p class="text-sm text-gray-600">Completed</p>
                <p class="text-2xl font-bold text-gray-900">10</p>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center">
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
              </div>
              <div class="ml-4">
                <p class="text-sm text-gray-600">Wishlist Items</p>
                <p class="text-2xl font-bold text-gray-900">5</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
