<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
      <p class="mt-2 text-sm text-gray-600">
        Already have an account? 
        <a routerLink="/account/login" class="text-primary-600 hover:text-primary-700 font-medium">
          Sign in
        </a>
      </p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">
            First Name
          </label>
          <input 
            id="first_name"
            type="text" 
            formControlName="first_name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            placeholder="John"
          />
        </div>
        <div>
          <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">
            Last Name
          </label>
          <input 
            id="last_name"
            type="text" 
            formControlName="last_name"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            placeholder="Doe"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email Address
        </label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          placeholder="john.doe@example.com"
        />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" 
             class="mt-1 text-sm text-red-600">
          Please enter a valid email address
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          placeholder="••••••••"
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" 
             class="mt-1 text-sm text-red-600">
          Password must be at least 6 characters
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">
          Confirm Password
        </label>
        <input 
          id="confirm_password"
          type="password" 
          formControlName="confirm_password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-500 focus:border-transparent"
          placeholder="••••••••"
        />
        <div *ngIf="registerForm.get('confirm_password')?.hasError('passwordMismatch') && registerForm.get('confirm_password')?.touched" 
             class="mt-1 text-sm text-red-600">
          Passwords do not match
        </div>
      </div>

      <div>
        <label class="flex items-start">
          <input 
            type="checkbox" 
            formControlName="terms"
            class="mt-1 rounded border-gray-300 text-primary-600 focus:ring-primary-500"
          />
          <span class="ml-2 text-sm text-gray-700">
            I agree to the 
            <a href="#" class="text-primary-600 hover:text-primary-700">Terms and Conditions</a>
            and 
            <a href="#" class="text-primary-600 hover:text-primary-700">Privacy Policy</a>
          </span>
        </label>
      </div>

      <button 
        type="submit"
        [disabled]="isSubmitting"
        class="w-full bg-primary-600 text-white py-3 rounded-md hover:bg-primary-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isSubmitting">Create Account</span>
        <span *ngIf="isSubmitting">Creating Account...</span>
      </button>
    </form>
  </div>
</div>
