<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">My Wishlist</h1>
      <p class="mt-2 text-gray-600">Your saved products</p>
    </div>

    <div *ngIf="(wishlist$ | async) as wishlist">
      <!-- Wishlist Items -->
      <div *ngIf="wishlist.length > 0; else emptyWishlist" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <app-product-card 
          *ngFor="let product of wishlist" 
          [product]="product">
        </app-product-card>
      </div>

      <!-- Empty Wishlist -->
      <ng-template #emptyWishlist>
        <div class="bg-white rounded-lg shadow-md p-12 text-center">
          <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <h3 class="text-2xl font-semibold text-gray-900 mb-2">Your wishlist is empty</h3>
          <p class="text-gray-600 mb-6">Save items you love to your wishlist</p>
          <a 
            routerLink="/products"
            class="inline-block bg-primary-600 text-white px-8 py-3 rounded-md hover:bg-primary-700 transition"
          >
            Continue Shopping
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</div>
