<!-- Hero Section -->
<section class="relative h-96 md:h-[500px] overflow-hidden">
  <div class="relative w-full h-full">
    <div 
      *ngFor="let slide of heroSlides; let i = index"
      [class.opacity-100]="currentSlide === i"
      [class.opacity-0]="currentSlide !== i"
      class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
    >
      <img 
        [src]="slide.image" 
        [alt]="'Hero banner for ' + slide.title + ' showing ' + slide.subtitle"
        class="w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-white">
          <div class="max-w-2xl">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">{{slide.title}}</h1>
            <p class="text-xl md:text-2xl mb-8">{{slide.subtitle}}</p>
            <a 
              [routerLink]="[slide.link]"
              class="inline-block bg-blue-400 text-white px-8 py-4 rounded-lg hover:bg-blue-500 transition text-lg font-semibold"
            >
              {{slide.cta}}
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button 
      (click)="prevSlide()"
      class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-20 hover:bg-opacity-30 text-white p-3 rounded-full transition"
      aria-label="Previous slide"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    
    <button 
      (click)="nextSlide()"
      class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-20 hover:bg-opacity-30 text-white p-3 rounded-full transition"
      aria-label="Next slide"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Slide Indicators -->
    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2">
      <button 
        *ngFor="let slide of heroSlides; let i = index"
        (click)="goToSlide(i)"
        [class.bg-white]="currentSlide === i"
        [class.bg-white-opacity-50]="currentSlide !== i"
        class="w-3 h-3 rounded-full transition"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
      ></button>
    </div>
  </div>
</section>

<!-- Categories Section -->
<section class="py-16 bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Shop by Category</h2>
      <p class="text-xl text-gray-600">Discover our wide range of products</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <a 
        *ngFor="let category of categories"
        [routerLink]="[category.link]"
        class="group relative overflow-hidden rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300"
      >
        <div class="aspect-w-3 aspect-h-2">
          <img 
            [src]="category.image" 
            [alt]="'Category image for ' + category.name + ' products'"
            class="w-full h-48 object-cover group-hover:scale-110 transition-transform duration-300"
          />
        </div>
        <div class="absolute inset-0 bg-black bg-opacity-30 flex items-end">
          <div class="p-6 text-white">
            <h3 class="text-xl font-semibold">{{category.name}}</h3>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>

<section class="py-16 bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-category-products 
      [categoryId]="22"
      [limit]="8"
      displayStyle="carousel"
      heading="Featured Electronics"
      [carouselAutoplay]="true"
      [carouselDelay]="5000"
    >
    </app-category-products>
  </div>
</section>

<!-- Featured Products -->
<section class="py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Featured Products</h2>
      <p class="text-xl text-gray-600">Check out our most popular items</p>
    </div>

    <div *ngIf="!(loading$ | async); else loadingTemplate">
      <div *ngIf="(featuredProducts$ | async) as products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <app-product-card 
          *ngFor="let product of products" 
          [product]="product">
        </app-product-card>
      </div>
    </div>

    <ng-template #loadingTemplate>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="bg-white rounded-lg shadow-md overflow-hidden animate-pulse">
          <div class="h-64 bg-gray-300"></div>
          <div class="p-4">
            <div class="h-4 bg-gray-300 rounded mb-2"></div>
            <div class="h-4 bg-gray-300 rounded w-2/3"></div>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="text-center mt-12">
      <a 
        routerLink="/products"
        class="inline-block bg-blue-400 text-white px-8 py-3 rounded-lg hover:bg-blue-500 transition font-semibold"
      >
        View All Products
      </a>
    </div>
  </div>
</section>

<!-- Newsletter Section -->
<section class="py-16 bg-blue-400">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="text-white">
      <h2 class="text-3xl md:text-4xl font-bold mb-4">Stay Updated</h2>
      <p class="text-xl mb-8 text-primary-100">Subscribe to our newsletter for the latest products and exclusive offers</p>
      
      <form class="max-w-md mx-auto flex">
        <input 
          type="email" 
          placeholder="Enter your email address"
          class="flex-1 px-4 py-3 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-primary-300"
        />
        <button 
          type="submit"
          class="bg-primary-800 hover:bg-primary-900 text-white px-8 py-3 rounded-r-lg transition font-semibold"
        >
          Subscribe
        </button>
      </form>
    </div>
  </div>
</section>
