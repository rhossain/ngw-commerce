<!-- Hero Banner Component -->
<app-hero-banner 
  [slides]="heroSlides"
  [autoPlay]="false"
  [autoPlayDelay]="5000"
  [showNavigationArrows]="true"
  [showNavigationDots]="true"
  height="md"
>
</app-hero-banner>

<!-- Dynamic Category Products Section (Smartphones) -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-category-products 
    [categoryId]="22"
    [limit]="10"
    displayStyle="carousel"
    [carouselAutoplay]="false"
    [carouselDelay]="5000"
    [carouselLoop]="true"
    [carouselSlidesPerView]="4"
    [carouselSpaceBetween]="20"
    [showViewAll]="true"
    [sortBy]="'popularity'"
    [sortOrder]="'desc'"
  >
  </app-category-products>
</section>

<!-- Top Categories Section -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-categories-display
    [categories]="topCategories"
    displayStyle="flat-list"
    [showTitle]="true"
    title="Shop From Top Categories"
    titleHighlight="Top Categories"
    [showViewAll]="true"
    viewAllLink="/products"
    size="md"
    [showCount]="false"
    [enableHover]="true"
  ></app-categories-display>
</section>

<!-- Top Electronics Brands -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-2xl md:text-3xl font-bold text-gray-900">
      Top <span class="text-cyan-500">Electronics Brands</span>
    </h3>
    <button [routerLink]="['/products']" 
            class="text-cyan-500 flex items-center gap-2 hover:text-cyan-600 font-medium">
      View All <i class="fas fa-chevron-right text-sm"></i>
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
    <!-- iPhone Card -->
    <div [routerLink]="[getBrandLink('apple')]"
         class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-8 text-white relative overflow-hidden shadow-xl cursor-pointer hover:shadow-2xl transition">
      <p class="text-xs font-semibold mb-2 text-gray-300">iPHONE</p>
      <i class="fab fa-apple text-6xl mb-4"></i>
      <p class="text-lg font-bold mb-4">UP to 80% OFF</p>
      <div class="absolute right-4 bottom-4 w-28 h-36 bg-gray-700/50 rounded-2xl flex items-center justify-center">
        <div class="w-20 h-32 bg-gray-600 rounded-xl"></div>
      </div>
    </div>

    <!-- Realme Card -->
    <div [routerLink]="[getBrandLink('realme')]"
         class="bg-yellow-100 rounded-2xl p-8 relative overflow-hidden shadow-xl cursor-pointer hover:shadow-2xl transition">
      <p class="text-xs font-bold mb-2 text-gray-800">REALME</p>
      <div class="bg-yellow-400 rounded-lg inline-block px-4 py-2 mb-4">
        <span class="text-white font-bold text-xl">realme</span>
      </div>
      <p class="text-lg font-bold text-gray-900">UP to 80% OFF</p>
      <div class="absolute right-4 bottom-4 w-28 h-36 bg-yellow-300/60 rounded-2xl flex items-center justify-center">
        <div class="w-20 h-32 bg-yellow-400 rounded-xl"></div>
      </div>
    </div>

    <!-- Xiaomi Card -->
    <div [routerLink]="[getBrandLink('xiaomi')]"
         class="bg-orange-50 rounded-2xl p-8 relative overflow-hidden shadow-xl cursor-pointer hover:shadow-2xl transition">
      <p class="text-xs font-bold mb-2 text-gray-800">XIAOMI</p>
      <div class="bg-orange-500 rounded-lg inline-block px-4 py-2 mb-4">
        <span class="text-white font-bold text-2xl">mi</span>
      </div>
      <p class="text-lg font-bold text-gray-900">UP to 80% OFF</p>
    </div>

    <!-- Blue Phone Card -->
    <div [routerLink]="[getBrandLink('samsung')]"
         class="bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl p-8 text-white relative overflow-hidden shadow-xl cursor-pointer hover:shadow-2xl transition">
      <div class="absolute right-4 top-1/2 transform -translate-y-1/2 w-32 h-40 bg-blue-500/50 rounded-2xl flex items-center justify-center">
        <div class="w-24 h-36 bg-blue-700 rounded-xl"></div>
      </div>
    </div>
  </div>

  <!-- Pagination Dots -->
  <div class="flex justify-center gap-2">
    <span class="w-2 h-2 bg-cyan-500 rounded-full"></span>
    <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
    <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
    <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
    <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
    <span class="w-2 h-2 bg-gray-300 rounded-full"></span>
  </div>
</section>

<!-- Daily Essentials -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 mb-16">
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-2xl md:text-3xl font-bold text-gray-900">
      Daily <span class="text-cyan-500">Essentials</span>
    </h3>
    <button [routerLink]="['/products']" [queryParams]="{category: 'essentials'}"
            class="text-cyan-500 flex items-center gap-2 hover:text-cyan-600 font-medium">
      View All <i class="fas fa-chevron-right text-sm"></i>
    </button>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-5">
    <div *ngFor="let item of dailyEssentials; let i = index"
         [routerLink]="['/products']" [queryParams]="{category: item.category}"
         class="bg-white rounded-xl p-5 text-center shadow-md hover:shadow-xl transition product-card cursor-pointer">
      <div [ngClass]="{
             'from-orange-100 to-yellow-100': i === 0,
             'from-green-100 to-emerald-100': i === 1,
             'from-red-100 to-pink-100': i === 2,
             'from-pink-100 to-red-100': i === 3,
             'from-yellow-100 to-orange-100': i === 4,
             'from-red-100 to-rose-100': i === 5
           }"
           class="bg-gradient-to-br rounded-xl p-4 mb-4 h-32 flex items-center justify-center">
        <i [class]="'fas ' + item.icon" 
           [ngClass]="{
             'text-orange-500': i === 0,
             'text-green-600': i === 1,
             'text-red-500': i === 2,
             'text-pink-600': i === 3,
             'text-yellow-500': i === 4,
             'text-red-600': i === 5
           }"
           class="text-5xl"></i>
      </div>
      <p class="font-semibold text-gray-900 text-sm mb-1">{{ item.name }}</p>
      <p class="text-green-600 text-xs font-medium">{{ item.discount }}</p>
    </div>
  </div>
</section>

<!-- Loading Spinner -->
<div *ngIf="loading$ | async" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6">
    <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-cyan-500"></div>
  </div>
</div>
